name: Performance problem
description: hashcat cracks correctly, but runs slower or uses more memory than it should.
labels: ["type: performance"]
body:
  - type: markdown
    attributes:
      value: |
        If hashcat cracks wrong or crashes, use the bug report instead. A comparison on the same device and driver is the most useful, for example the same command on an older hashcat version.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: The problem still happens with the latest release or with current master.
          required: true
        - label: I searched the existing issues and found no report of it.
          required: true
  - type: input
    id: version
    attributes:
      label: hashcat version
      description: The output of `hashcat --version`.
      placeholder: v8.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - BSD
        - Android
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is slow
      description: What runs slower or needs more memory than you expected, and what you compare it with, such as an older hashcat version, another tool or another device.
    validations:
      required: true
  - type: textarea
    id: speed
    attributes:
      label: Command and speed
      description: The exact command and the speed it reaches. For a single hash-mode, the output of `hashcat -b -m MODE` is a good start. Add the same for the version or device you compare with.
      render: text
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: The output of `hashcat -I`, and the driver version.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: For example the last version that was fast, or whether another backend behaves differently.
