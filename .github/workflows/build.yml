name: Build

##
## What is built, and what is run.
##
## The user base is Linux and Windows, so those two are built in both arrangements and, more to the
## point, the binaries they produce are started and made to crack something. A build that links is
## not a build that runs: a plugin whose imports do not resolve, a package missing a directory and a
## core the loader finds somewhere else all pass a compile and fail a user.
##
## macOS is built in the arrangement it ships in. FreeBSD stands in for the BSDs here, the other
## three are built weekly by .github/workflows/bsd.yml.
##
## The release binaries are the cross compiled ones, so those are what the run jobs take apart. They
## are downloaded into a directory of their own and run there, which is what an unpacked archive is.
##

env:
  include_paths: |
    bridges/
    charsets/
    docs/
    extra/
    feeds/
    layouts/
    masks/
    modules/
    OpenCL/
    rules/
    tunings/
    example*
    hashcat*
    libhashcat*
    !**/*.debug

on:
  push:
    branches:
      - master
    tags:
      - v*
    paths:
      - 'OpenCL/**.h'
      - 'OpenCL/**.cl'
      - 'include/**.h'
      - 'src/**.c'
      - 'src/**.mk'
      - 'tools/**'
      - '**/Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'OpenCL/**.h'
      - 'OpenCL/**.cl'
      - 'include/**.h'
      - 'src/**.c'
      - 'src/**.mk'
      - 'tools/**'
      - '**/Makefile'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            os_name_lowercase: linux
            shared: 0
          - os: ubuntu-latest
            os_name: Linux
            os_name_lowercase: linux
            shared: 1
          - os: macos-latest
            os_name: macOS
            os_name_lowercase: macos
            shared: 1
          - os: windows-latest
            os_name: Windows
            os_name_lowercase: windows
            shared: 0
          - os: windows-latest
            os_name: Windows
            os_name_lowercase: windows
            shared: 1
          - os: freebsd
            os_name: FreeBSD
            os_name_lowercase: freebsd
            shared: 0

    name: Build ${{ matrix.os_name }} (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    runs-on: ${{ matrix.os == 'freebsd' && 'ubuntu-latest' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install dependencies (Windows only)
        if: matrix.os_name_lowercase == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            gcc
            git
            libiconv-devel
            make
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-rustup
            mingw-w64-x86_64-toolchain
            python3

      - name: Setup Rustup (Windows only)
        if: matrix.os_name_lowercase == 'windows'
        shell: msys2 {0}
        env:
          PATH: /mingw64/bin:$PATH
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Build (Windows)
        if: matrix.os_name_lowercase == 'windows'
        shell: msys2 {0}
        env:
          SHARED: ${{ matrix.shared }}
          PATH: /mingw64/bin:$PATH
          WIN_PYTHON: ""
        run: |
          make ENABLE_LTO=0 CC=clang CXX=clang++
          bash tools/test_package.sh . --no-device

      - name: Build (Linux/macOS)
        if: matrix.os_name_lowercase == 'linux' || matrix.os_name_lowercase == 'macos'
        env:
          SHARED: ${{ matrix.shared }}
          TERM: xterm
        run: |
          make ENABLE_LTO=0 CC=clang CXX=clang++
          bash tools/test_package.sh . --no-device

      - name: Build (FreeBSD)
        if: matrix.os_name_lowercase == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        env:
          SHARED: ${{ matrix.shared }}
        with:
          usesh: true
          envs: SHARED
          prepare: |
            pkg update
            pkg install -y bash git gcc gmake gsed python3 rust llvm
          run: |
            gmake ENABLE_LTO=0 CC=clang CXX=clang++
            bash tools/test_package.sh . --no-device

      - name: Generate documentation
        if: matrix.os_name_lowercase == 'linux' && matrix.shared == 0
        env:
          SHARED: ${{ matrix.shared }}
          TERM: xterm
        run: |
         cd .github/workflows/
         bash -v ./generate_docs.sh || true # make sure return code of generate docs is always successful (we don't want a build to break because of it..)

      - name: Commit changes to docs
        if: matrix.os_name_lowercase == 'linux' && matrix.shared == 0
        env:
          SHARED: ${{ matrix.shared }}
        run: |
          # https://github.com/actions/checkout?tab=readme-ov-file#push-a-commit-using-the-built-in-token
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hashcat-help.md
          git add docs/hashcat-example-hashes.md
          if ! git diff --staged --quiet; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              if [ "$GITHUB_REF_NAME" = "master" ]; then
                git commit -m "Automatically updated docs/hashcat-help.md or docs/hashcat-example-hashes.md (by Github Action)"
                git push
              else
                echo "Not on master branch (currently: $GITHUB_REF_NAME): skipping commit because otherwise we may be in detached head"
              fi
            else
              echo "docs/hashcat-help.md or docs/hashcat-example-hashes.md are not up-to-date:"
              echo "..."
              git diff --staged | cat
              echo "..."
              echo "this will be updated automatically when merged into master"
            fi
          else
            echo "No need to update docs/hashcat-help.md or docs/hashcat-example-hashes.md"
          fi

      - name: Generate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashcat-${{ matrix.os_name_lowercase }}-${{ matrix.shared == 0 && 'static' || 'shared' }}
          path: ${{ env.include_paths }}

  binaries:
    name: Build binaries (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
               wget ca-certificates zstd tar git make pkg-config llvm cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 libc++-dev libc++abi-dev lld pkg-config python3

          mkdir ~/src && cd ~/src
          mkdir /opt/win-iconv-64
          git clone --depth 1 --branch v0.0.10 https://github.com/win-iconv/win-iconv.git && cd win-iconv
          cmake \
            -D WIN_ICONV_BUILD_EXECUTABLE=OFF \
            -D CMAKE_INSTALL_PREFIX=/opt/win-iconv-64 \
            -D CMAKE_C_COMPILER=$(which x86_64-w64-mingw32-gcc) \
            -D CMAKE_CXX_COMPILER=$(which x86_64-w64-mingw32-g++) \
            -D CMAKE_SYSTEM_NAME=Windows \
            -D CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -D CMAKE_C_STANDARD_LIBRARIES="-static-libgcc" \
            -D CMAKE_CXX_STANDARD_LIBRARIES="-static-libgcc -static-libstdc++" .
          make install

          cd ~/src
          mkdir /opt/win-python && cd /opt/win-python
          wget https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-python-3.12.11-1-any.pkg.tar.zst
          unzstd mingw-w64-x86_64-python-3.12.11-1-any.pkg.tar.zst
          tar -xf mingw-w64-x86_64-python-3.12.11-1-any.pkg.tar

          cd ~/src
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          export PATH="$HOME/.cargo/bin:${PATH}"
          rustup target add x86_64-pc-windows-gnu

      - name: Build binaries
        env:
          SHARED: ${{ matrix.shared }}
          TERM: xterm
        run: |
          make binaries \
               CC=clang CC_LINUX=clang CC_WIN=clang CXX=clang++ \
               CXX_LINUX=clang++ CXX_WIN=clang++ \
               AR=llvm-ar AR_LINUX=llvm-ar AR_WIN=llvm-ar

      - name: Generate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashcat-cross-${{ matrix.shared == 0 && 'static' || 'shared' }}
          path: ${{ env.include_paths }}

  run_linux:
    name: Run Linux (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: hashcat-cross-${{ matrix.shared == 0 && 'static' || 'shared' }}
          path: package

      # a runner has no GPU, so the device is the processor it already has. Everything the checks do
      # runs on one, the slowest of them is md5crypt against three words

      - name: Install an OpenCL CPU runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd

      - name: List the backend devices
        run: |
          chmod +x package/hashcat.bin
          cd package && ./hashcat.bin -I

      - name: Run the package
        run: bash tools/test_package.sh package

  run_windows:
    name: Run Windows (${{ matrix.shared == 0 && 'Static' || 'Shared' }})
    needs: binaries
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: hashcat-cross-${{ matrix.shared == 0 && 'static' || 'shared' }}
          path: package

      # Windows ships no OpenCL device of its own, so the CPU runtime is installed here. It is the
      # one Intel publishes as a wheel, which is a download and a registry entry rather than an
      # installer. Nothing of it goes near the package directory, so what hashcat.exe finds beside
      # itself is still only what was unpacked there.

      - name: Install an OpenCL CPU runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-warn-script-location intel-opencl-rt

          $runtime = python -c "import os, sys; print(os.path.join(sys.prefix, 'Library', 'bin'))"
          $icd = Join-Path $runtime 'intelocl64.dll'

          if (-not (Test-Path -Path $icd)) { throw "no OpenCL CPU runtime at $icd" }

          foreach ($key in 'HKLM:\SOFTWARE\Khronos', 'HKLM:\SOFTWARE\Khronos\OpenCL', 'HKLM:\SOFTWARE\Khronos\OpenCL\Vendors')
          {
            if (-not (Test-Path -Path $key)) { New-Item -Path $key | Out-Null }
          }

          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\OpenCL\Vendors' -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null

          Add-Content -Path $env:GITHUB_PATH -Value $runtime

      - name: List the backend devices
        shell: cmd
        run: |
          cd package
          hashcat.exe -I

      - name: Run the package
        shell: bash
        run: bash tools/test_package.sh package
